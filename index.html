<script>

/* =====================================================
   CONFIGURARE
   ===================================================== */

const CONFIG = {

  herName: "Cristina",

  myName: "Gabriel",

  /*
    AICI primești răspunsurile.
    Dacă acesta este emailul tău, îl poți lăsa.
  */
  email: "gabriel.carstea165@gmail.com",

  activities: [
    "Cafea",
    "Plimbare",
    "Cină",
    "Surprinde-mă"
  ],

  timeSlots: [
    "17:00",
    "18:00",
    "19:00",
    "20:00",
    "21:00"
  ],

  dodgesBeforeGone: 6

};


/* =====================================================
   FUNCȚII GENERALE
   ===================================================== */

const $ = (id) => document.getElementById(id);

const reduced =
  matchMedia("(prefers-reduced-motion: reduce)").matches;


/* =====================================================
   SALUT
   ===================================================== */

if (CONFIG.herName) {

  $("greet").textContent =
    "Hei, " + CONFIG.herName + "!";

} else {

  $("greet").classList.add("hidden");

}


/* =====================================================
   BUTONUL "NU"
   ===================================================== */

const yes = $("yes");
const no = $("no");
const slot = $("noSlot");
const whisper = $("whisper");

let dodges = 0;
let gone = false;
let lastDodge = 0;

const teases = [

  "Hopa, a alunecat 😅",

  "Ești aproape, dar nu chiar.",

  "Se pare că nu vrea să fie apăsat.",

  "Mai încearcă… 😏",

  "Ultima șansă, nu mai rezistă."

];


function dodge(ev) {

  if (gone) return;

  if (ev && ev.cancelable) {
    ev.preventDefault();
  }

  const now = Date.now();

  if (now - lastDodge < 300) {
    return;
  }

  lastDodge = now;

  dodges++;

  if (dodges >= CONFIG.dodgesBeforeGone) {
    vanish();
    return;
  }


  if (!no.classList.contains("fly")) {

    const r = no.getBoundingClientRect();

    slot.style.width = r.width + "px";
    slot.style.height = r.height + "px";

    no.style.left = r.left + "px";
    no.style.top = r.top + "px";

    no.classList.add("fly");

    void no.offsetWidth;

  }


  const w = no.offsetWidth;
  const h = no.offsetHeight;
  const pad = 14;

  const maxX =
    Math.max(pad, innerWidth - w - pad);

  const maxY =
    Math.max(pad, innerHeight - h - pad);

  const yr =
    yes.getBoundingClientRect();

  const cur =
    no.getBoundingClientRect();

  let x = pad;
  let y = pad;


  for (let i = 0; i < 40; i++) {

    x =
      pad + Math.random() * (maxX - pad);

    y =
      pad + Math.random() * (maxY - pad);


    const overlapsYes =
      x < yr.right + 24 &&
      x + w > yr.left - 24 &&
      y < yr.bottom + 24 &&
      y + h > yr.top - 24;


    const tooClose =
      Math.hypot(
        x - cur.left,
        y - cur.top
      ) < 140;


    if (!overlapsYes && !tooClose) {
      break;
    }

  }


  no.style.left = x + "px";
  no.style.top = y + "px";


  no.style.setProperty(
    "--s",
    Math.max(
      0.55,
      1 - dodges * 0.08
    )
  );


  yes.style.setProperty(
    "--s",
    1 + dodges * 0.06
  );


  whisper.textContent =
    teases[
      Math.min(
        dodges - 1,
        teases.length - 1
      )
    ];

}


function vanish() {

  gone = true;

  no.classList.add("gone");

  setTimeout(() => {

    no.style.display = "none";
    slot.style.display = "none";

  }, 400);


  yes.style.setProperty(
    "--s",
    1.25
  );


  whisper.textContent =
    "Butonul „Nu” a plecat. Mai ai o singură variantă 😄";

}


[
  "pointerenter",
  "pointerdown",
  "click",
  "focus",
  "touchstart"
].forEach((eventName) => {

  no.addEventListener(
    eventName,
    dodge,
    { passive: false }
  );

});


/* =====================================================
   PASUL 2
   ===================================================== */

yes.addEventListener("click", () => {

  $("step1").classList.add("hidden");

  $("step2").classList.remove("hidden");

  scrollTo(0, 0);

  burst();

});


/* =====================================================
   DATA MINIMĂ
   ===================================================== */

const today = new Date();

const iso = (x) => {

  return (
    x.getFullYear() +
    "-" +
    String(
      x.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      x.getDate()
    ).padStart(2, "0")
  );

};

$("date").min = iso(today);


/* =====================================================
   ORE RAPIDE
   ===================================================== */

CONFIG.timeSlots.forEach((time) => {

  const button =
    document.createElement("button");

  button.type = "button";

  button.textContent = time;

  button.className = "btn";

  button.style.cssText =
    "padding:8px 14px;" +
    "font-size:.95rem;" +
    "font-weight:500;" +
    "background:transparent;" +
    "color:var(--text);" +
    "border-color:var(--line)";


  button.addEventListener(
    "click",
    () => {

      $("time").value = time;

    }
  );


  $("timeChips").appendChild(button);

});


/* =====================================================
   ACTIVITĂȚI
   ===================================================== */

CONFIG.activities.forEach((activity, index) => {

  const id =
    "act" + index;


  const input =
    document.createElement("input");

  input.type = "radio";
  input.name = "activitate";
  input.id = id;
  input.value = activity;


  if (index === 0) {
    input.checked = true;
  }


  const label =
    document.createElement("label");

  label.htmlFor = id;
  label.textContent = activity;


  $("actChips").append(
    input,
    label
  );

});


/* =====================================================
   DATA FRUMOS FORMATATĂ
   ===================================================== */

function prettyDate(value) {

  const [
    year,
    month,
    day
  ] =
    value
      .split("-")
      .map(Number);


  return new Date(
    year,
    month - 1,
    day
  ).toLocaleDateString(
    "ro-RO",
    {
      weekday: "long",
      day: "numeric",
      month: "long"
    }
  );

}


/* =====================================================
   TRIMITERE EMAIL
   ===================================================== */

$("form").addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const error =
      $("err");

    error.classList.add(
      "hidden"
    );


    const data =
      $("date").value;

    const ora =
      $("time").value;

    const activity =
      document.querySelector(
        'input[name="activitate"]:checked'
      )?.value || "";

    const note =
      $("note").value.trim();


    /* verificare */

    if (!data || !ora) {

      error.textContent =
        "Alege ziua și ora ca să pot confirma.";

      error.classList.remove(
        "hidden"
      );

      return;

    }


    const zi =
      prettyDate(data);


    const button =
      $("send");

    button.disabled = true;

    button.textContent =
      "Se trimite…";


    try {

      /*
        Trimitem direct către FormSubmit.

        FormSubmit va trimite datele
        către emailul din CONFIG.email.
      */

      const response =
        await fetch(
          "https://formsubmit.co/ajax/" +
          encodeURIComponent(
            CONFIG.email
          ),
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body: JSON.stringify({

              _subject:
                "💌 Răspuns la invitație",

              _template:
                "table",

              _captcha:
                "false",

              _url:
                window.location.href,

              Raspuns:
                "DA 🎉",

              Nume:
                CONFIG.herName ||
                "Cristina",

              Ziua:
                zi,

              Ora:
                ora,

              Activitate:
                activity,

              Mesaj:
                note || "-"

            })
          }
        );


      /*
        Încercăm să citim răspunsul
        FormSubmit.
      */

      const result =
        await response
          .json()
          .catch(() => null);


      console.log(
        "Răspuns FormSubmit:",
        result
      );


      const success =
        response.ok &&
        (
          result?.success === true ||
          result?.success === "true"
        );


      if (!success) {

        throw new Error(
          result?.message ||
          "FormSubmit nu a acceptat trimiterea."
        );

      }


      /* =================================================
         SUCCES
         ================================================= */

      $("summary").innerHTML =

        zi.charAt(0).toUpperCase() +
        zi.slice(1) +

        "<br>la " +
        ora +

        " · " +
        activity;


      $("step2").classList.add(
        "hidden"
      );

      $("step3").classList.remove(
        "hidden"
      );


      scrollTo(0, 0);

      burst();


    } catch (errorObject) {

      console.error(
        "Eroare FormSubmit:",
        errorObject
      );


      button.disabled = false;

      button.textContent =
        "Confirmă";


      error.textContent =
        "Nu s-a putut trimite răspunsul. " +
        "Încearcă din nou în câteva secunde.";


      error.classList.remove(
        "hidden"
      );

    }

  }
);


/* =====================================================
   CONFETTI
   ===================================================== */

function burst() {

  if (reduced) {
    return;
  }


  const canvas =
    $("confetti");

  const ctx =
    canvas.getContext("2d");


  canvas.width =
    innerWidth;

  canvas.height =
    innerHeight;


  const colors = [

    "#ff5d8f",
    "#ffc46b",
    "#fbf1ec",
    "#b9a9d6"

  ];


  const particles =
    Array.from(
      { length: 110 },
      () => ({

        x:
          innerWidth / 2,

        y:
          innerHeight * 0.55,

        vx:
          (Math.random() - 0.5) * 16,

        vy:
          -Math.random() * 15 - 4,

        s:
          5 + Math.random() * 6,

        r:
          Math.random() * 6,

        vr:
          (Math.random() - 0.5) * 0.4,

        c:
          colors[
            (Math.random() *
              colors.length) | 0
          ]

      })
    );


  let frame = 0;


  (function tick() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    particles.forEach(
      (particle) => {

        particle.vy += 0.42;

        particle.x +=
          particle.vx;

        particle.y +=
          particle.vy;

        particle.r +=
          particle.vr;


        ctx.save();

        ctx.translate(
          particle.x,
          particle.y
        );

        ctx.rotate(
          particle.r
        );

        ctx.fillStyle =
          particle.c;

        ctx.fillRect(
          -particle.s / 2,
          -particle.s / 3,
          particle.s,
          particle.s * 0.6
        );

        ctx.restore();

      }
    );


    if (++frame < 140) {

      requestAnimationFrame(
        tick
      );

    } else {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    }

  })();

}

</script>
